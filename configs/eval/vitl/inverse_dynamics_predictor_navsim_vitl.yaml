cpus_per_task: 8
eval_name: inverse_dynamics_predictor
folder: /data/chainflow-vla/outputs/vjepa2/evals
mem_per_gpu: 80G
nodes: 1
max_workers: 8
resume_checkpoint: true
tag: navsim-fpc8-predictor-vitl-ac-autoreg-88w
tasks_per_node: 1
experiment:
  probe:
    num_heads: 16
    num_probe_blocks: 2
    action_dim: 6
    action_steps: 3
  data:
    dataset_train: /data/chainflow-vla/navsim_vjepa_fpc8_camf0/train_action_xy_scene_train_50k.csv
    dataset_val: /data/chainflow-vla/navsim_vjepa_fpc8_camf0/train_action_xy_scene_test_5k.csv
    frames_per_clip: 8
    context_frames: 4
    predictor_action_steps: 4
    target_action_start_step: 1
    resolution: 256
    crop_size: 256
    rollout_mode: autoregressive
    normalize_reps: true
    num_workers: 4
    pin_memory: true
  optimization:
    batch_size: 8
    num_epochs: 20
    use_bfloat16: true
    multihead_kwargs:
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.001
      start_lr: 0.001
      warmup: 0.05
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.05
      lr: 0.0003
      start_lr: 0.0003
      warmup: 0.05
      weight_decay: 0.05
model:
  checkpoint: /data/chainflow-vla/outputs/vjepa2/lamp-ac-256-8f-vitl-88w/latest.pt
  model_name: vit_large
  patch_size: 16
  tubelet_size: 2
  pred_depth: 12
  pred_embed_dim: 384
  pred_is_frame_causal: true
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: false
  use_rope: true
  use_sdpa: true
  use_silu: false
  use_pred_silu: false
  wide_silu: true
