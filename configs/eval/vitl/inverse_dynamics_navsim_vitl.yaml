cpus_per_task: 8
eval_name: inverse_dynamics_frozen
folder: /data/chainflow-vla/outputs/vjepa2/evals
mem_per_gpu: 80G
nodes: 1
max_workers: 8
resume_checkpoint: true
tag: navsim-fpc8-last4-vitl-navsim
tasks_per_node: 1
experiment:
  probe:
    num_heads: 16
    num_probe_blocks: 2
    action_dim: 6
    action_steps: 3
  data:
    dataset_train: /data/chainflow-vla/navsim_vjepa_fpc8_camf0/train_action_xy_scene_train_50k.csv
    dataset_val: /data/chainflow-vla/navsim_vjepa_fpc8_camf0/train_action_xy_scene_test_5k.csv
    frames_per_clip: 4
    source_frames_per_clip: 8
    input_frame_start: 4
    resolution: 256
    action_start_col: 3
    num_workers: 4
    pin_memory: true
  optimization:
    batch_size: 16
    num_epochs: 20
    use_bfloat16: true
    multihead_kwargs:
    - final_lr: 0.0
      final_weight_decay: 0.01
      lr: 0.001
      start_lr: 0.001
      warmup: 0.05
      weight_decay: 0.01
    - final_lr: 0.0
      final_weight_decay: 0.05
      lr: 0.0003
      start_lr: 0.0003
      warmup: 0.05
      weight_decay: 0.05
model_kwargs:
  checkpoint: /data/chainflow-vla/outputs/vjepa2/navsim-fpc8-256/latest.pt
  module_name: evals.inverse_dynamics_frozen.modelcustom.vit_encoder
  pretrain_kwargs:
    encoder:
      checkpoint_key: target_encoder
      model_name: vit_large_rope
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_sdpa: true
      use_silu: false
      wide_silu: true
  wrapper_kwargs: {}
