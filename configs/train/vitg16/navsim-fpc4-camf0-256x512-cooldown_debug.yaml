app: vjepa
nodes: 1
tasks_per_node: 8
cpus_per_task: 8
mem_per_gpu: 80G
folder: /data/chainflow-vla/outputs/vjepa2/navsim-fpc4-camf0-256x512-vitg-cooldown-debug
data:
  dataset_type: VideoDataset
  datasets:
  - /data/chainflow-vla/navsim_vjepa_fpc4_camf0/train.csv
  datasets_weights:
  - 1.0
  batch_size: 4
  crop_size:
  - 256
  - 512
  dataset_fpcs:
  - 4
  fps: 2
  num_workers: 0
  patch_size: 16
  persistent_workers: false
  pin_mem: false
  tubelet_size: 2
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.9
  - 1.1
  random_resize_scale:
  - 0.7
  - 1.0
  reprob: 0.0
loss:
  loss_exp: 1.0
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: /data/e2e/diffusiondrive/vjepa2/ckpts/vjepa2-vitg-fpc64-256/original/model.pth
  save_every_freq: 10
  seed: 239
  use_sdpa: true
model:
  model_name: vit_giant_xformers
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  anneal_ckpt: /data/e2e/diffusiondrive/vjepa2/ckpts/vjepa2-vitg-fpc64-256/original/model.pth
  ema:
  - 0.99925
  - 0.99925
  epochs: 20
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 300
  ipe_scale: 1.0
  is_anneal: true
  lr: 1.0e-04
  resume_anneal: true
  start_lr: 2.0e-05
  warmup: 0
  weight_decay: 0.04
