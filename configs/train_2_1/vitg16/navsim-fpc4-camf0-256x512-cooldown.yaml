  ema:
  - 0.99925
  - 0.99925
  epochs: 20
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 100
  ipe_scale: 1.0
  is_anneal: true
  lr: 6.0e-05
  resume_anneal: true
  start_lr: 1.0e-05
  warmup: 0
  weight_decay: 0.04
