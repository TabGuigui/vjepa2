app: vjepa_2_1
nodes: 1
tasks_per_node: 8
cpus_per_task: 8
mem_per_gpu: 80G
folder: /data/chainflow-vla/outputs/vjepa2/navsim-fpc4-camf0-256x512-vitg-cooldown
data:
